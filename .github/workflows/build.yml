name: Build and Release Mod Jars

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
      - "b*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Mod Jars with Gradle
        run: ./gradlew build --no-daemon

      - name: Extract Build Info and Jar Filenames
        id: build_info
        if: github.event_name != 'pull_request'
        run: |
          FABRIC_JAR=$(basename $(ls fabric/build/libs/custom_mobs-fabric-*.jar | grep -v "shadow" | grep -v "sources" | head -n 1))
          FORGE_JAR=$(basename $(ls forge/build/libs/custom_mobs-forge-*.jar | grep -v "shadow" | grep -v "sources" | head -n 1))
          BUILD_NUM=$(cat build_number.txt | tr -d '\r\n')
          echo "fabric_jar=${FABRIC_JAR}" >> $GITHUB_OUTPUT
          echo "forge_jar=${FORGE_JAR}" >> $GITHUB_OUTPUT
          echo "build_num=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "tag=b${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "title=Build ${BUILD_NUM}" >> $GITHUB_OUTPUT

      - name: Upload Fabric Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomMobs-Fabric-1.20.1
          path: |
            fabric/build/libs/custom_mobs-fabric-*.jar
            !fabric/build/libs/*-dev-shadow.jar
          if-no-files-found: warn

      - name: Upload Forge Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomMobs-Forge-1.20.1
          path: |
            forge/build/libs/custom_mobs-forge-*.jar
            !forge/build/libs/*-dev-shadow.jar
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ steps.build_info.outputs.tag }}
          name: ${{ steps.build_info.outputs.title }}
          files: |
            fabric/build/libs/custom_mobs-fabric-*.jar
            forge/build/libs/custom_mobs-forge-*.jar
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Fabric to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        if: github.event_name != 'pull_request'
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: 1601972
          name: ${{ steps.build_info.outputs.fabric_jar }}
          version: 1.0.0-b${{ steps.build_info.outputs.build_num }}
          version-type: release
          files: |
            fabric/build/libs/custom_mobs-fabric-*.jar
            !fabric/build/libs/*-dev-shadow.jar
          loaders: |
            fabric
          game-versions: |
            1.20.1

      - name: Publish Forge to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        if: github.event_name != 'pull_request'
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: 1601972
          name: ${{ steps.build_info.outputs.forge_jar }}
          version: 1.0.0-b${{ steps.build_info.outputs.build_num }}
          version-type: release
          files: |
            forge/build/libs/custom_mobs-forge-*.jar
            !forge/build/libs/*-dev-shadow.jar
          loaders: |
            forge
          game-versions: |
            1.20.1

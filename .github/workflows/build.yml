name: Build and Release Mod Jars

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
      - "b*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Mod Jars with Gradle
        run: ./gradlew build --no-daemon

      - name: Extract Build Number
        id: build_info
        if: github.event_name != 'pull_request'
        run: |
          BUILD_NUM=$(cat build_number.txt | tr -d '\r\n')
          echo "tag=b${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "title=Build ${BUILD_NUM}" >> $GITHUB_OUTPUT

      - name: Upload Fabric Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomMobs-Fabric-1.20.1
          path: |
            fabric/build/libs/custom_mobs-fabric-*.jar
            !fabric/build/libs/*-dev-shadow.jar
          if-no-files-found: warn

      - name: Upload Forge Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomMobs-Forge-1.20.1
          path: |
            forge/build/libs/custom_mobs-forge-*.jar
            !forge/build/libs/*-dev-shadow.jar
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ steps.build_info.outputs.tag }}
          name: ${{ steps.build_info.outputs.title }}
          files: |
            fabric/build/libs/custom_mobs-fabric-*.jar
            forge/build/libs/custom_mobs-forge-*.jar
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

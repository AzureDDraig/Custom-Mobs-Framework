name: Build and Release Mod Jars

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
      - "b*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Mod Jars with Gradle
        run: ./gradlew build --no-daemon

      - name: Extract Build Info and Production Jar Paths
        id: build_info
        if: github.event_name != 'pull_request'
        run: |
          FABRIC_PATH=$(find fabric/build/libs -maxdepth 1 -name "custom_mobs-fabric-*.jar" ! -name "*-dev*" ! -name "*-sources*" ! -name "*-shadow*" | head -n 1)
          FORGE_PATH=$(find forge/build/libs -maxdepth 1 -name "custom_mobs-forge-*.jar" ! -name "*-dev*" ! -name "*-sources*" ! -name "*-shadow*" | head -n 1)
          FABRIC_JAR=$(basename "${FABRIC_PATH}")
          FORGE_JAR=$(basename "${FORGE_PATH}")
          BUILD_NUM=$(cat build_number.txt | tr -d '\r\n')
          echo "fabric_path=${FABRIC_PATH}" >> $GITHUB_OUTPUT
          echo "forge_path=${FORGE_PATH}" >> $GITHUB_OUTPUT
          echo "fabric_jar=${FABRIC_JAR}" >> $GITHUB_OUTPUT
          echo "forge_jar=${FORGE_JAR}" >> $GITHUB_OUTPUT
          echo "build_num=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "tag=b${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "title=Build ${BUILD_NUM}" >> $GITHUB_OUTPUT

      - name: Upload Fabric Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomMobs-Fabric-1.20.1
          path: ${{ steps.build_info.outputs.fabric_path }}
          if-no-files-found: warn

      - name: Upload Forge Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomMobs-Forge-1.20.1
          path: ${{ steps.build_info.outputs.forge_path }}
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ steps.build_info.outputs.tag }}
          name: ${{ steps.build_info.outputs.title }}
          files: |
            ${{ steps.build_info.outputs.fabric_path }}
            ${{ steps.build_info.outputs.forge_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Fabric to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        if: github.event_name != 'pull_request'
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: 1601972
          name: ${{ steps.build_info.outputs.fabric_jar }}
          version: 1.0.0-b${{ steps.build_info.outputs.build_num }}
          version-type: release
          files: ${{ steps.build_info.outputs.fabric_path }}
          loaders: |
            fabric
          game-versions: |
            1.20.1

      - name: Publish Forge to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        if: github.event_name != 'pull_request'
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: 1601972
          name: ${{ steps.build_info.outputs.forge_jar }}
          version: 1.0.0-b${{ steps.build_info.outputs.build_num }}
          version-type: release
          files: ${{ steps.build_info.outputs.forge_path }}
          loaders: |
            forge
          game-versions: |
            1.20.1
